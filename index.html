<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--p:#0b1f3a;--a:#ff6a2b;--bg:#f4f6fb;--tx:#121829;--mut:#5b6478;--bd:#e4e8f1;--r:16px;--sh:0 8px 30px rgba(11,31,58,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:"Hind Siliguri",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);line-height:1.6;font-size:16px;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button,input,select,textarea{font:inherit}
svg{width:1.2em;height:1.2em;flex:none}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px}
.ann{background:var(--a);color:#fff;text-align:center;padding:7px 14px;font-size:14px;font-weight:600}
.hdr{background:#fff;position:sticky;top:0;z-index:50;border-bottom:1px solid var(--bd);box-shadow:0 2px 14px rgba(11,31,58,.05)}
.hrow{display:flex;align-items:center;gap:16px;min-height:68px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:var(--p);white-space:nowrap}
.brand img{height:var(--lh,44px);width:auto}
.brand .mk{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--a));color:#fff;display:grid;place-items:center;font-size:18px}
.search{flex:1;max-width:440px;display:flex;background:var(--bg);border:1px solid var(--bd);border-radius:999px;overflow:hidden;margin-left:auto}
.search input{flex:1;border:0;background:none;padding:10px 16px;outline:none;min-width:0}
.search button{border:0;background:var(--p);color:#fff;padding:0 18px;cursor:pointer;display:grid;place-items:center}
.nav{display:flex;gap:4px;align-items:center}
.nav a{padding:8px 12px;border-radius:10px;font-weight:600;color:var(--p);font-size:15px}
.nav a:hover{background:var(--bg)}
.cartbtn{position:relative;display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--bg);color:var(--p);font-size:20px}
.cartbtn b{position:absolute;top:-5px;right:-5px;background:var(--a);color:#fff;font-size:12px;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 5px}
.burger{display:none;border:0;background:var(--bg);width:44px;height:44px;border-radius:12px;cursor:pointer;color:var(--p);font-size:20px}
.catbar{background:#fff;border-bottom:1px solid var(--bd)}
.catbar .wrap{display:flex;gap:8px;overflow-x:auto;padding-top:10px;padding-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;padding:7px 16px;border-radius:999px;background:var(--bg);border:1px solid var(--bd);font-size:14px;font-weight:600;color:var(--p)}
.chip.on,.chip:hover{background:var(--p);color:#fff;border-color:var(--p)}
main{min-height:60vh}
.hero{background:radial-gradient(900px 480px at 88% -10%,color-mix(in srgb,var(--a) 38%,transparent),transparent 62%),linear-gradient(135deg,var(--p),color-mix(in srgb,var(--p) 65%,#000));color:#fff;padding:64px 0;overflow:hidden}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center}
.hero .tag{display:inline-block;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);padding:5px 14px;border-radius:999px;font-size:14px;font-weight:600}
.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.15;margin:14px 0 12px;letter-spacing:-.5px}
.hero p{font-size:18px;opacity:.88;max-width:560px;margin:0 0 26px}
.hbtns{display:flex;gap:12px;flex-wrap:wrap}
.himg img{border-radius:22px;box-shadow:0 30px 60px rgba(0,0,0,.35);margin:auto;max-height:420px;width:auto}
.orb{position:relative;aspect-ratio:1;max-width:360px;margin:auto;width:100%}
.orb i{position:absolute;border:1.5px dashed rgba(255,255,255,.28);border-radius:50%;inset:0;animation:spin 40s linear infinite}
.orb i:nth-child(2){inset:15%;animation-duration:28s;animation-direction:reverse}
.orb i:nth-child(3){inset:30%;animation-duration:20s}
.orb i:after{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;border-radius:50%;background:var(--a);box-shadow:0 0 18px var(--a)}
.orb em{position:absolute;inset:38%;border-radius:50%;background:linear-gradient(135deg,var(--a),color-mix(in srgb,var(--a) 50%,#fff));display:grid;place-items:center;font-style:normal;font-size:34px;font-weight:700;box-shadow:0 0 50px color-mix(in srgb,var(--a) 70%,transparent)}
@keyframes spin{to{transform:rotate(360deg)}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:12px;border:0;font-weight:700;cursor:pointer;color:#fff;transition:.2s;font-size:16px;text-align:center}
.btn:hover{transform:translateY(-2px);filter:brightness(1.07)}
.b-a{background:var(--a)}.b-p{background:var(--p)}.b-call{background:#1d6bff}.b-wa{background:#1fa855}.b-tg{background:#2aa3e0}.b-ms{background:#0a7cff}.b-wag{background:#0d8f3f}
.btn.out{background:transparent;color:inherit;border:2px solid currentColor}
.hero .btn.out{color:#fff}
.sec{padding:44px 0}.sec.sm{padding:26px 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:22px}
.sh h2{font-size:clamp(22px,3.2vw,32px);margin:0;color:var(--p);letter-spacing:-.3px}
.sh p{margin:4px 0 0;color:var(--mut)}
.sh a{color:var(--a);font-weight:700;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.card{background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);transition:.25s;cursor:pointer;display:flex;flex-direction:column;border:1px solid var(--bd)}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(11,31,58,.15)}
.cimg{position:relative;aspect-ratio:1/1;background:var(--bg);overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover;transition:.5s}.card:hover .cimg img{transform:scale(1.06)}
.off{position:absolute;top:10px;left:10px;background:#e5252a;color:#fff;font-size:13px;font-weight:700;padding:3px 10px;border-radius:8px}
.bdg{position:absolute;top:10px;right:10px;background:var(--p);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:8px}
.oos{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.65);color:#fff;text-align:center;padding:6px;font-weight:700}
.cbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cbody h3{margin:0;font-size:17px;line-height:1.35;color:var(--p)}
.pr{display:flex;align-items:baseline;gap:10px}.pr b{font-size:21px;color:var(--a)}.pr s{color:#9aa1b3;font-size:15px}
.stars{color:#f5a623;letter-spacing:1px;font-size:14px}.stars i{font-style:normal;color:#d6dae5}.stars small{color:var(--mut);letter-spacing:0;margin-left:6px;font-size:13px}
.cact{margin-top:auto;padding-top:8px}.cact .btn{width:100%;padding:10px;font-size:15px}
.ph{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,color-mix(in srgb,var(--p) 85%,#fff),var(--a));color:#fff;font-size:44px;font-weight:700}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.fbox{background:#fff;border-radius:var(--r);padding:22px;border:1px solid var(--bd);box-shadow:var(--sh);transition:.2s}
.fbox:hover{transform:translateY(-4px)}
.fbox .fi{width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--a) 14%,#fff);display:grid;place-items:center;font-size:26px;margin-bottom:12px}
.fbox h3{margin:0 0 4px;color:var(--p);font-size:18px}.fbox p{margin:0;color:var(--mut);font-size:15px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;counter-reset:s}
.step{background:#fff;border-radius:var(--r);padding:22px;border:1px solid var(--bd);position:relative}
.step:before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--a);color:#fff;font-weight:700;margin-bottom:10px}
.step h3{margin:0 0 4px;color:var(--p)}.step p{margin:0;color:var(--mut)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.cat{background:#fff;border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;text-align:center;transition:.2s;box-shadow:var(--sh)}
.cat:hover{transform:translateY(-4px)}.cat .ci{aspect-ratio:16/10;background:var(--bg)}.cat .ci img{width:100%;height:100%;object-fit:cover}.cat b{display:block;padding:12px;color:var(--p)}
.rv{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.rvc{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.rvc p{margin:8px 0 10px}.rvc b{color:var(--p)}
.faq details{background:#fff;border:1px solid var(--bd);border-radius:14px;margin-bottom:10px;overflow:hidden}
.faq summary{cursor:pointer;padding:16px 20px;font-weight:700;color:var(--p);list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}.faq summary:after{content:"+";font-size:22px;color:var(--a);line-height:1}
.faq details[open] summary:after{content:"−"}.faq .ans{padding:0 20px 18px;color:var(--mut)}
.prose{background:#fff;border-radius:var(--r);padding:24px;border:1px solid var(--bd)}
.prose.plain{background:none;border:0;padding:0}
.prose h2,.prose h3{color:var(--p);margin:18px 0 8px}.prose p{margin:0 0 12px}.prose ul{padding-left:22px;margin:0 0 12px}.prose li{margin:4px 0}.prose a{color:var(--a);font-weight:600}
.video{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}
.video iframe,.video video{position:absolute;inset:0;width:100%;height:100%;border:0}
.fig img{border-radius:16px;margin:auto;width:100%;box-shadow:var(--sh)}.fig figcaption{text-align:center;color:var(--mut);margin-top:8px;font-size:14px}
.gl{display:grid;gap:14px}.gl img{border-radius:14px;width:100%;aspect-ratio:1;object-fit:cover}
.bl{background:#fff;border:1px solid var(--bd);border-radius:var(--r);padding:20px 24px}.bl ul{margin:6px 0 0;padding-left:22px}
.center{text-align:center}
.crumb{padding:18px 0 0;color:var(--mut);font-size:14px}.crumb a{color:var(--a);font-weight:600}
.pp{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;background:#fff;border-radius:22px;padding:28px;box-shadow:var(--sh);margin:16px 0 26px;border:1px solid var(--bd)}
.gal .main{border-radius:18px;overflow:hidden;aspect-ratio:1/1;background:var(--bg);border:1px solid var(--bd);position:relative}
.gal .main>img,.gal .main>.ph{width:100%;height:100%;object-fit:cover}
.gal .main .off{font-size:15px;padding:5px 12px}
.thumbs{display:flex;gap:10px;margin-top:12px;overflow:auto;padding-bottom:4px}
.th{width:74px;height:74px;flex:none;border:2px solid transparent;border-radius:12px;overflow:hidden;padding:0;background:var(--bg);cursor:pointer;position:relative}
.th img,.th .ph{width:100%;height:100%;object-fit:cover;font-size:18px}.th.on{border-color:var(--a)}
.th .play{display:grid;place-items:center;height:100%;background:#111;color:#fff;font-size:22px}
.pi h1{font-size:clamp(24px,3.4vw,34px);margin:0 0 8px;color:var(--p);line-height:1.2}
.pbox{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0}
.pbox b{font-size:36px;color:var(--a);line-height:1}.pbox s{font-size:22px;color:#e5252a}.pbox span{background:#e5252a;color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px}
.pts{list-style:none;padding:0;margin:14px 0}.pts li{padding:4px 0 4px 26px;position:relative}.pts li:before{content:"✓";position:absolute;left:0;color:#fff;background:var(--a);width:18px;height:18px;border-radius:50%;font-size:12px;display:grid;place-items:center;top:8px}
.plans{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.plan{border:2px solid var(--bd);background:#fff;border-radius:12px;padding:10px 16px;cursor:pointer;text-align:left;transition:.15s}
.plan b{display:block;color:var(--p)}.plan small{color:var(--a);font-weight:700;font-size:15px}
.plan.on{border-color:var(--a);background:color-mix(in srgb,var(--a) 8%,#fff)}
.lbl{font-weight:700;color:var(--p);margin:14px 0 4px;display:block}
.qty{display:inline-flex;border:1px solid var(--bd);border-radius:12px;overflow:hidden;margin:10px 0 14px;background:#fff}
.qty button{width:46px;height:46px;border:0;background:#fff;font-size:22px;cursor:pointer}.qty button:hover{background:var(--bg)}
.qty span{display:grid;place-items:center;width:56px;font-weight:700;border-inline:1px solid var(--bd)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.btnrow .full{grid-column:1/-1}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 14px}.chips span{background:var(--bg);border:1px solid var(--bd);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600;color:var(--p)}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--bd);margin-bottom:18px;overflow:auto}
.tab{border:0;background:none;padding:12px 20px;font-weight:700;color:var(--mut);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-size:16px}
.tab.on{color:var(--a);border-color:var(--a)}
.panel{display:none}.panel.on{display:block}
.pwrap{background:#fff;border-radius:22px;padding:24px 28px;box-shadow:var(--sh);border:1px solid var(--bd)}
.ctbl{background:#fff;border-radius:var(--r);border:1px solid var(--bd);overflow:hidden}
.crow{display:grid;grid-template-columns:84px 1fr auto auto;gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--bd)}
.crow:last-child{border:0}.crow .cim{width:84px;height:84px;border-radius:12px;overflow:hidden;background:var(--bg)}.crow .cim img{width:100%;height:100%;object-fit:cover}
.crow h4{margin:0;color:var(--p)}.crow small{color:var(--mut)}
.crow input.info{width:100%;margin-top:8px;padding:8px 12px;border:1px solid var(--bd);border-radius:10px}
.rm{border:0;background:none;color:#e5252a;cursor:pointer;font-size:14px;font-weight:600}
.co{display:grid;grid-template-columns:1.3fr 1fr;gap:24px;align-items:start}
.box{background:#fff;border-radius:var(--r);border:1px solid var(--bd);padding:22px;box-shadow:var(--sh)}
.box h3{margin:0 0 14px;color:var(--p)}
.in{display:block;width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;margin-bottom:12px;background:#fff;outline:none}
.in:focus{border-color:var(--a);box-shadow:0 0 0 3px color-mix(in srgb,var(--a) 20%,transparent)}
.pay{display:flex;align-items:center;gap:12px;border:1px solid var(--bd);border-radius:12px;padding:10px 14px;margin-bottom:10px}
.pay i{width:12px;height:36px;border-radius:6px;flex:none}.pay div{flex:1}.pay small{color:var(--mut);display:block}.pay b{font-size:17px}
.pay button{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;color:var(--p);padding:12px 0}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}
.ftr{background:var(--p);color:#cfd6e6;margin-top:50px;padding:44px 0 0}
.fg{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:30px}
.ftr h4{color:#fff;margin:0 0 12px}.ftr a{display:block;padding:3px 0;color:#cfd6e6}.ftr a:hover{color:#fff}
.ftr .brand{color:#fff;margin-bottom:10px}
.fb{margin-top:34px;border-top:1px solid rgba(255,255,255,.12);padding:18px 0;text-align:center;font-size:14px}
.pm{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.pm span{padding:3px 12px;border-radius:8px;color:#fff;font-size:13px;font-weight:700}
.fabs{position:fixed;right:16px;bottom:18px;z-index:60;display:flex;flex-direction:column;align-items:center;gap:12px}
.fabl{display:flex;flex-direction:column;gap:12px;transition:.25s}.fabs.closed .fabl{opacity:0;transform:translateY(20px);pointer-events:none;height:0;overflow:hidden}
.fab{width:54px;height:54px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;cursor:pointer;box-shadow:0 8px 22px rgba(0,0,0,.25);transition:.2s;font-size:26px}
.fab:hover{transform:scale(1.1)}.fab.ms{background:linear-gradient(135deg,#00b2ff,#006aff)}.fab.cl{background:#1fb55a}.fab.wa{background:#0b8f3c}.fab.tg{background:#e5252a}.fabs.closed .fab.tg{background:var(--p)}
.fab.top{background:var(--a);display:none}.fab.top.show{display:grid}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,30px);background:#111a2e;color:#fff;padding:12px 22px;border-radius:12px;opacity:0;pointer-events:none;transition:.3s;z-index:200;font-weight:600;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.prev{position:fixed;left:14px;bottom:14px;z-index:70;background:#111a2e;color:#fff;border-radius:14px;padding:10px 14px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);flex-wrap:wrap;max-width:calc(100vw - 100px)}
.prev button{border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:700;background:var(--a);color:#fff}.prev button.g{background:#2b3552}
@media(max-width:900px){.pp{grid-template-columns:1fr;padding:18px;gap:22px}.hgrid{grid-template-columns:1fr}.himg,.orb{display:none}.co{grid-template-columns:1fr}.fg{grid-template-columns:1fr 1fr}.hero{padding:44px 0}}
@media(max-width:760px){.burger{display:grid}.nav{display:none;position:absolute;top:100%;left:0;right:0;background:#fff;flex-direction:column;align-items:stretch;padding:10px 18px 16px;border-bottom:1px solid var(--bd);box-shadow:0 14px 24px rgba(0,0,0,.08)}.nav.open{display:flex}.hrow{flex-wrap:wrap;position:relative;gap:10px;padding:8px 0}.search{order:5;flex-basis:100%;max-width:none;margin:0}.brand{margin-right:auto}.nav{order:9}}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.cbody{padding:10px 12px 12px}.cbody h3{font-size:15px}.pr b{font-size:18px}.crow{grid-template-columns:64px 1fr;}.crow .cim{width:64px;height:64px}.btnrow{grid-template-columns:1fr}.fg{grid-template-columns:1fr}.pwrap{padding:16px}.sec{padding:30px 0}.cact .btn{font-size:14px}}

.adm{background:#eef1f7;min-height:100vh;color:#121829}
.atop{background:var(--p);color:#fff;padding:12px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:40}
.atop b{font-size:18px}.atop .st{margin-left:auto;font-size:14px;opacity:.85}
.atop button,.abtn{border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer;background:var(--a);color:#fff}
.abtn.g{background:#e3e8f3;color:var(--p)}.abtn.r{background:#fde6e6;color:#c4161c}.abtn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.atop button.g{background:rgba(255,255,255,.16)}

.aside{display:flex;flex-direction:column;gap:6px;position:sticky;top:76px;align-self:start}
.aside button{border:0;background:#fff;border-radius:12px;padding:12px 16px;text-align:left;font-weight:700;cursor:pointer;color:var(--p);font-size:15px}
.aside button.on{background:var(--p);color:#fff}
.amain{min-width:0}
.ah{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.ah h2{margin:0;flex:1;font-size:24px}

.acard{background:#fff;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 2px 10px rgba(11,31,58,.05)}

.prow{display:flex;align-items:center;gap:12px;background:#fff;border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.prow:hover{border-color:var(--a)}.prow .pt{width:52px;height:52px;border-radius:10px;overflow:hidden;background:var(--bg);flex:none}.prow .pt img{width:100%;height:100%;object-fit:cover}
.prow .pn{flex:1;min-width:0}.prow .pn b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.prow .pn small{color:var(--mut)}

.fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--a)}
.fld input[type=color]{width:70px;height:40px;border:1px solid #d5dbea;border-radius:8px;padding:2px;background:#fff}
.fld.f-chk label{display:flex;gap:8px;align-items:center;cursor:pointer}.fld.f-chk input{width:20px;height:20px}
.fh{font-size:12.5px;color:#7a8398;margin-top:4px}

.imgf{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.iprev{width:84px;height:84px;border:1px dashed #b8c0d6;border-radius:12px;display:grid;place-items:center;overflow:hidden;background:#f6f8fc;color:#8a93a8;font-size:12px;flex:none}.iprev img{width:100%;height:100%;object-fit:cover}
.imgf .ic2{flex:1;min-width:200px;display:flex;flex-direction:column;gap:8px}
.list>.litem,.bcard{background:#f7f9fd;border:1px solid #e1e6f2;border-radius:12px;padding:12px;margin-bottom:10px}
.lhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}.lhead b{flex:1;font-size:14px}
.bcard>summary{display:flex;align-items:center;gap:6px;cursor:pointer;list-style:none;font-weight:700}.bcard>summary::-webkit-details-marker{display:none}.bcard>summary span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bcard>summary small{color:#7a8398;font-weight:400}.bcard[open]>summary{margin-bottom:12px;border-bottom:1px solid #e1e6f2;padding-bottom:10px}
.addrow{display:flex;gap:8px;flex-wrap:wrap}.addrow select{padding:9px;border-radius:10px;border:1px solid #d5dbea}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}.imgs .litem{margin:0}
.pub{display:grid;gap:14px}.pub ol{margin:6px 0 0;padding-left:20px;line-height:1.9}
